<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelican on a Bicycle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
            font-family: sans-serif;
        }
        .canvas-container {
            width: 800px;
            max-width: 100%;
            background-color: #e6f7ff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        
        /* SVG Animations */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        @keyframes dash {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(-200px); opacity: 0; }
        }
        @keyframes pedal {
            100% { transform: rotate(-360deg); }
        }

        .wheel {
            transform-origin: center;
            animation: spin 1s linear infinite;
        }
        /* Override origin for specific wheels */
        .back-wheel { transform-origin: 250px 450px; }
        .front-wheel { transform-origin: 550px 450px; }
        .gear { transform-origin: 420px 450px; animation: spin 1s linear infinite; }
        
        .bobbing {
            animation: bob 0.5s ease-in-out infinite;
        }
        
        .speed-line {
            animation: dash 0.8s linear infinite;
        }
        .speed-line:nth-child(1) { animation-duration: 0.6s; animation-delay: 0.1s; }
        .speed-line:nth-child(2) { animation-duration: 0.9s; animation-delay: 0.3s; }
        .speed-line:nth-child(3) { animation-duration: 0.5s; animation-delay: 0.5s; }
    </style>
</head>
<body>

<div class="canvas-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
      <rect width="800" height="600" fill="#e6f7ff" />
      
      <!-- Speed lines (motion) in background -->
      <g stroke="#bdc3c7" stroke-width="6" stroke-linecap="round">
          <line class="speed-line" x1="800" y1="350" x2="680" y2="350" />
          <line class="speed-line" x1="920" y1="300" x2="760" y2="300" />
          <line class="speed-line" x1="850" y1="400" x2="740" y2="400" />
          <line class="speed-line" x1="700" y1="200" x2="600" y2="200" />
          <line class="speed-line" x1="900" y1="500" x2="800" y2="500" />
      </g>

      <!-- Bicycle Shadow -->
      <ellipse cx="400" cy="540" rx="200" ry="20" fill="#cce0ff" />

      <!-- Back Wheel Group -->
      <g class="wheel back-wheel">
          <circle cx="250" cy="450" r="80" stroke="#2c3e50" stroke-width="16" fill="none" />
          <circle cx="250" cy="450" r="70" stroke="#bdc3c7" stroke-width="4" fill="none" />
          <g stroke="#95a5a6" stroke-width="3">
            <line x1="250" y1="370" x2="250" y2="530" />
            <line x1="170" y1="450" x2="330" y2="450" />
            <line x1="193" y1="393" x2="307" y2="507" />
            <line x1="307" y1="393" x2="193" y2="507" />
          </g>
      </g>

      <!-- Front Wheel Group -->
      <g class="wheel front-wheel">
          <circle cx="550" cy="450" r="80" stroke="#2c3e50" stroke-width="16" fill="none" />
          <circle cx="550" cy="450" r="70" stroke="#bdc3c7" stroke-width="4" fill="none" />
          <g stroke="#95a5a6" stroke-width="3">
            <line x1="550" y1="370" x2="550" y2="530" />
            <line x1="470" y1="450" x2="630" y2="450" />
            <line x1="493" y1="393" x2="607" y2="507" />
            <line x1="607" y1="393" x2="493" y2="507" />
          </g>
      </g>

      <!-- Bobbing Group (Frame and Pelican) -->
      <g class="bobbing">
          <!-- Bicycle Frame -->
          <polyline points="250,450 350,300 500,300 550,450" stroke="#e74c3c" stroke-width="20" fill="none" stroke-linejoin="round" />
          <line x1="350" y1="300" x2="420" y2="450" stroke="#e74c3c" stroke-width="20" stroke-linecap="round" />
          <line x1="250" y1="450" x2="420" y2="450" stroke="#e74c3c" stroke-width="12" stroke-linecap="round" />

          <!-- Seat and Handlebars -->
          <line x1="350" y1="300" x2="330" y2="260" stroke="#7f8c8d" stroke-width="16" stroke-linecap="round" />
          <path d="M 300 260 Q 330 250 360 260" fill="none" stroke="#2c3e50" stroke-width="18" stroke-linecap="round" /> <!-- Seat -->
          
          <line x1="500" y1="300" x2="520" y2="240" stroke="#7f8c8d" stroke-width="16" stroke-linecap="round" />
          <path d="M 500 240 Q 530 220 540 250" fill="none" stroke="#2c3e50" stroke-width="16" stroke-linecap="round" /> <!-- Handlebar -->

          <!-- Pedals and Gears -->
          <g class="gear">
              <circle cx="420" cy="450" r="25" fill="#34495e" />
              <line x1="420" y1="450" x2="440" y2="390" stroke="#bdc3c7" stroke-width="10" stroke-linecap="round" />
              <circle cx="440" cy="390" r="10" fill="#2c3e50" />
              <line x1="420" y1="450" x2="400" y2="510" stroke="#bdc3c7" stroke-width="10" stroke-linecap="round" />
              <circle cx="400" cy="510" r="10" fill="#2c3e50" />
          </g>

          <!-- THE PELICAN -->
          
          <!-- Back Leg -->
          <path d="M 380 250 Q 360 350 420 450" fill="none" stroke="#f39c12" stroke-width="14" stroke-linecap="round" />
          
          <!-- Body -->
          <ellipse cx="370" cy="200" rx="70" ry="90" fill="#ffffff" stroke="#2c3e50" stroke-width="10" transform="rotate(20 370 200)" />
          <ellipse cx="370" cy="200" rx="60" ry="80" fill="#f8f9fa" transform="rotate(20 370 200)" /> <!-- Highlight -->

          <!-- Front Leg -->
          <path d="M 360 270 Q 400 330 440 390" fill="none" stroke="#e67e22" stroke-width="16" stroke-linecap="round" />

          <!-- Wing -->
          <path d="M 350 150 Q 450 180 390 270 Q 320 220 350 150" fill="#ecf0f1" stroke="#2c3e50" stroke-width="8" stroke-linejoin="round" />
          
          <!-- Neck -->
          <path d="M 400 130 Q 460 50 490 80" fill="none" stroke="#ffffff" stroke-width="45" stroke-linecap="round" />
          <path d="M 390 140 Q 470 40 500 80" fill="none" stroke="#2c3e50" stroke-width="55" stroke-linecap="round" />
          <path d="M 400 130 Q 460 50 490 80" fill="none" stroke="#ffffff" stroke-width="45" stroke-linecap="round" />

          <!-- Head -->
          <circle cx="490" cy="80" r="35" fill="#ffffff" stroke="#2c3e50" stroke-width="10" />

          <!-- Eye -->
          <circle cx="505" cy="70" r="6" fill="#2c3e50" />
          <circle cx="507" cy="68" r="2" fill="#ffffff" /> <!-- Glint -->

          <!-- Beak -->
          <path d="M 520 80 Q 680 90 530 140 Q 480 120 490 100" fill="#f1c40f" stroke="#2c3e50" stroke-width="10" stroke-linejoin="round" />
          <path d="M 520 80 Q 640 90 520 100" fill="none" stroke="#d35400" stroke-width="4" /> <!-- Mouth line -->
          <path d="M 510 110 Q 560 135 530 140" fill="#f39c12" /> <!-- Pouch shadow -->

          <!-- Hat -->
          <path d="M 470 50 L 510 50 L 500 20 L 480 20 Z" fill="#e74c3c" stroke="#2c3e50" stroke-width="8" stroke-linejoin="round" />
          <circle cx="490" cy="15" r="8" fill="#f1c40f" stroke="#2c3e50" stroke-width="5" />
      </g>
    </svg>
</div>

</body>
</html>
